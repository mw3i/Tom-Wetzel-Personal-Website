name: Deploy to GitHub Pages

on:
  push:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      # No custom domain yet: the site is served from
      # https://<user>.github.io/<repo-name>/, so every internal link needs
      # that repo-name prefix baked in at build time (NEXT_PUBLIC_BASE_PATH).
      #
      # Once a real domain is ready:
      #   1. Add a `public/CNAME` file containing the domain.
      #   2. Delete the NEXT_PUBLIC_BASE_PATH line below (root-served, no prefix).
      #   3. Point NEXT_PUBLIC_SITE_URL at the new domain.
      #   4. Point the domain's DNS at GitHub Pages and enable it in repo Settings → Pages.
      - name: Build static site
        env:
          NEXT_PUBLIC_SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
